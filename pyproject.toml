[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-builder"
version = "0.1.8"
description = "A small file-based TensorFlow/Keras experimentation tool."
requires-python = ">=3.10"
dependencies = [
  "tensorflow",
  "keras",
  "numpy",
  "pandas",
  "tomli; python_version < '3.11'",
  "tomli-w",
  "pillow",
  "matplotlib",
  "scikit-learn",
  "scipy",
  "PyYAML",
  "fastapi>=0.141.1",
]

[project.scripts]
oracle-dataset = "oracle_builder.datasets.cli:main"
oracle-run = "oracle_builder.artifacts.cli:main"
oracle-import-classification = "oracle_builder.data.classification_import:main"
oracle-train = "model_training:main"
oracle-infer = "model_inference:main"
oracle-evaluate = "model_evaluate:main"
oracle-mask-builder = "mask_builder:main"
oracle-model = "oracle_builder.products.cli:main"
oracle-serve = "oracle_builder.api.cli:main"
oracle-embed = "oracle_builder.embedding.cli:main"
oracle-orchestrator = "oracle_builder.orchestration.cli:main"

[tool.setuptools]
py-modules = [
  "mask_builder",
  "model_evaluate",
  "model_inference",
  "model_training",
]

[tool.setuptools.packages.find]
include = ["oracle_builder*", "oracle_data_contracts*"]

[project.optional-dependencies]
gpu-linux = [
  "tensorflow[and-cuda]",
]
gpu-wsl2 = [
  "tensorflow[and-cuda]",
]
gpu-macos = [
  "tensorflow>=2.18,<2.19; platform_system == 'Darwin'",
  "tensorflow-metal==1.2.0; platform_system == 'Darwin'",
  "numpy>=2.0,<2.1; platform_system == 'Darwin'",
  "tifffile<2026.5.0; platform_system == 'Darwin'",
]
gui = [
  "napari[all]",
  "magicgui",
  "scipy",
  "scikit-image",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
