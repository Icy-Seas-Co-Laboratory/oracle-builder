[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-builder"
version = "0.1.0"
description = "A small file-based TensorFlow/Keras experimentation tool."
requires-python = ">=3.10"
dependencies = [
  "tensorflow",
  "keras",
  "numpy",
  "pandas",
  "tomli; python_version < '3.11'",
  "tomli-w",
  "pillow",
  "matplotlib",
  "scikit-learn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

