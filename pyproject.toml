[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-builder"
version = "0.1.0"
description = "A small file-based TensorFlow/Keras experimentation tool."
requires-python = ">=3.10"
dependencies = [
  "tensorflow",
  "keras",
  "numpy",
  "pandas",
  "tomli; python_version < '3.11'",
  "tomli-w",
  "pillow",
  "matplotlib",
  "scikit-learn",
  "scipy",
  "PyYAML",
]

[project.optional-dependencies]
gpu-linux = [
  "tensorflow[and-cuda]",
]
gpu-wsl2 = [
  "tensorflow[and-cuda]",
]
gpu-macos = [
  "tensorflow>=2.18,<2.19; platform_system == 'Darwin'",
  "tensorflow-metal==1.2.0; platform_system == 'Darwin'",
  "numpy>=2.0,<2.1; platform_system == 'Darwin'",
  "tifffile<2026.5.0; platform_system == 'Darwin'",
]
gui = [
  "napari[all]",
  "magicgui",
  "scipy",
  "scikit-image",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
