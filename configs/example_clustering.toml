# V2 embedding recipe for a downstream clustering workflow.
# Oracle Builder no longer trains task = "clustering" directly. Train this
# versioned embedding artifact, then version clustering separately from its cache.

[run]
task = "embedding"
model = "simple_cnn"
seed = 123
notes = "V2 BYOL embedding recipe for downstream spherical k-means"
[architecture]
version = 2

[input]
channels = ["intensity"]
[input.geometry]
type = "preserve_aspect_pad"

[data]
input_shape = [128, 128]
batch_size = 256
shuffle_buffer = 16384
validation_split = 0.20
test_split = 0.10
split_strategy = "auto"
[data.streaming]
enabled = true
reader_workers = 8
prefetch_batches = 4
deterministic = false
sqlite_cache_kib = 262144

[preprocessing]
resize_mode = "fit_pad" # Kept equivalent to input.geometry.
normalization = "dtype"
rescale = true
invert = "auto"
pad_value = 0.0
upscale_limit = 2.0
pad_anchor = "center"
pad_mode = "constant"
crop_anchor = "center"
interpolation = "bilinear"
channel_mode = "grayscale"
percentile_low = 1.0
percentile_high = 99.0
derive_after_augmentation = false
[preprocessing.derived_channels]
gradient_magnitude = false
local_contrast = false
local_contrast_sigma = 3.0

[encoder]
family = "simple_cnn"
variant = "simple_cnn"
[stem]
type = "native"
kernel_size = 3
stride = 1
pool = "none"
[normalization]
type = "batch"
[pooling]
type = "avg"
[image_embedding.projection]
type = "linear"
output_dim = 256
l2_normalize = true
normalize = true
dropout = 0.0
[model]
# SimpleCNN is a compact, high-throughput encoder. Increase base_filters only
# after confirming that GPU compute rather than decode is the bottleneck.
base_filters = 32
embedding_dim = 256
normalize_embeddings = true
dropout = 0.0

[self_supervised]
enabled = true
method = "byol"
epochs = 50
verbose = 1
learning_rate = 0.001
teacher_momentum = 0.99
projection_dim = 128
projection_hidden_dim = 256
temperature = 0.10
minimum_global_batch_size = 2
collapse_std_threshold = 0.001
collapse_embedding_spread_threshold = 0.005
ssl_optimizer = "adamw"
weight_decay = 0.0001
beta_1 = 0.9
beta_2 = 0.999
optimizer_epsilon = 0.0000001
vicreg_variance_weight = 25.0
vicreg_covariance_weight = 1.0
vicreg_target_std = 1.0
encoder_variance_weight = 25.0
encoder_covariance_weight = 1.0
encoder_target_std = 0.05
[self_supervised.embedding_health]
enabled = true
sample_count = 4096
pair_count = 32768
minimum_effective_rank = 8.0
maximum_mean_pairwise_cosine = 0.95
maximum_p95_pairwise_cosine = 0.995
maximum_mean_direction_norm = 0.95
[self_supervised.augmentation]
enabled = true
invert = false
rotation = 0.08
zoom = 0.15
translation = 0.10
skew = 0.05
flip_horizontal = true
flip_vertical = false
brightness = 0.20
contrast = 0.20
gaussian_noise = 0.03
fill_value = 0.0

[recovery]
enabled = true
save_every_epochs = 1
[distribution]
strategy = "single"
devices = []
cross_device_ops = "auto"
fallback_to_single = true
memory_growth = true
gpu_selection = "unused_first"
require_unused_gpu = false
allow_busy_fallback = false
gpu_light_share_memory_mb = 1024
gpu_light_share_utilization_percent = 15
gpu_lease_directory = "/tmp/oracle-builder-gpu-leases"

[inference]
batch_size = "auto"
minimum_batch_size = 64
maximum_batch_size = 1024
memory_budget_mb = 4096
progress = false
[output]
save_checkpoints = false
save_predictions = false
save_figures = false
export_savedmodel = true
prediction_commit_batches = 20
[output.intermediate_artifacts]
# The downstream clustering job reads this bounded representation cache.
enabled = true
format = "auto"
split = "test"
batch_size = 256
include_feature_map = false
