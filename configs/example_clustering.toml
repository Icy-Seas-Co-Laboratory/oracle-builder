# High-throughput self-supervised ROI organization with spherical k-means.
# The input must be a frozen classification Dataset V1 SQLite database. Existing
# LEGACY compatibility configuration. New runs should use
# configs/example_embedding.toml and let downstream consumers define clusters.

[run]
task = "clustering"
model = "simple_cnn"
seed = 123
notes = "High-throughput BYOL SimpleCNN encoder followed by cosine-space ROI clustering"

[data]
# Keep this resolution aligned with the standard ROI contract. A global batch of
# 1024 is divided across visible replicas by TensorFlow (512 per GPU on two GPUs).
input_shape = [224, 224, 1]
batch_size = 1024
shuffle_buffer = 16384

[data.streaming]
# Parallel SQLite decoding and bounded prefetch keep the GPUs supplied without
# retaining the complete ROI collection in memory.
enabled = true
reader_workers = 8
prefetch_batches = 4
deterministic = false
sqlite_cache_kib = 262144

[preprocessing]
# These values are part of the eventual sealed encoder contract. "auto" polarity
# uses the source dataset's recorded imaging polarity.
resize_mode = "fit_pad"
normalization = "dtype"
rescale = true
invert = "auto"
pad_value = 0.0
interpolation = "bilinear"
channel_mode = "grayscale"
percentile_low = 1.0
percentile_high = 99.0

[distribution]
# "auto" uses all visible GPUs through MirroredStrategy and falls back to one
# device when necessary. The global data.batch_size must divide across replicas.
strategy = "auto"
devices = []
cross_device_ops = "auto"
fallback_to_single = true
memory_growth = true

[model]
# SimpleCNN is the fastest useful baseline for typical ROI clustering runs.
# base_filters controls the three convolution widths: 32, 64, and 128.
base_filters = 32
dropout = 0.0
embedding_dim = 256
normalize_embeddings = true

[self_supervised]
# BYOL avoids explicit negative-pair sampling and is a good default for large
# global batches. View augmentation is scoped here and does not use [augmentation].
enabled = true
method = "byol"
epochs = 50
verbose = 1
learning_rate = 0.001
teacher_momentum = 0.99
projection_dim = 128
projection_hidden_dim = 256
temperature = 0.10

# AdamW is a stable general-purpose optimizer for the encoder and projection heads.
ssl_optimizer = "adamw"
weight_decay = 0.0001
beta_1 = 0.9
beta_2 = 0.999
optimizer_epsilon = 0.0000001

# SSL diagnostics and collapse safeguards.
minimum_global_batch_size = 2
collapse_std_threshold = 0.001
collapse_embedding_spread_threshold = 0.005
vicreg_variance_weight = 25.0
vicreg_covariance_weight = 1.0
vicreg_target_std = 1.0

# SimCLR retains a disposable projector, but these terms protect the
# unit-normalized encoder embedding exported to clustering and inference.
encoder_variance_weight = 25.0
encoder_covariance_weight = 1.0
encoder_target_std = 0.05

[self_supervised.embedding_health]
# Product-space checks are computed from unaugmented serving embeddings before
# the artifact is sealed. They prevent a successful projector loss from hiding
# a narrow-cone encoder collapse.
enabled = true
sample_count = 4096
pair_count = 32768
minimum_effective_rank = 8.0
maximum_mean_pairwise_cosine = 0.95
maximum_p95_pairwise_cosine = 0.995
maximum_mean_direction_norm = 0.95

[self_supervised.augmentation]
# Moderate, domain-agnostic ROI perturbations. Adjust only these values when
# orientation, scale, or intensity is known to carry semantic information.
enabled = true
invert = false
rotation = 0.08
zoom = 0.15
translation = 0.10
skew = 0.05
flip_horizontal = true
flip_vertical = false
brightness = 0.20
contrast = 0.20
gaussian_noise = 0.03
fill_value = 0.0

[clustering]
method = "spherical_kmeans"
n_clusters = 8
novelty_percentile = 5.0
top_k = 5

# Bound the expensive silhouette calculation and the persistent serving index.
# All ROIs still contribute to centroids, cluster sizes, and novelty thresholds.
silhouette_max_samples = 2000
reference_neighbors_per_cluster = 64
fit_batch_size = 4096

[inference]
# Auto probing chooses the largest verified extraction batch up to 1024 while
# retaining a bounded memory budget. This affects embedding extraction only.
batch_size = "auto"
minimum_batch_size = 64
maximum_batch_size = 1024
memory_budget_mb = 4096
progress = false

[output]
save_checkpoints = false
save_predictions = false
save_figures = false
export_savedmodel = true
prediction_commit_batches = 20

[evaluation.benchmark]
enabled = true
warmup_batches = 2
measured_batches = 10
