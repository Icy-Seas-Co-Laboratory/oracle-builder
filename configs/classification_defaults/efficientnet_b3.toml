# Efficientnet-B3 efficientnet variant.
# Generated by scripts/generate_classification_default_configs.py; do not edit by hand.
# Copy this V2 preset for routine classification. Advanced settings inherit
# runtime defaults; see configs/reference_v2_exhaustive.toml for every option.

[run]
task = "classification"
seed = 123
notes = "efficientnet_b3 V2 classification preset"

[architecture]
version = 2

[input]
channels = ["intensity"]

[input.geometry]
type = "preserve_aspect_pad"

[data]
# The SQLite dataset supplies class count, label order, and durable source identity.
input_shape = [128, 128]
batch_size = 16
shuffle_buffer = 512
validation_split = 0.2
test_split = 0.1

[data.streaming]
# Decode only active batches; increase workers only when CPU decode limits throughput.
enabled = true
reader_workers = 4
prefetch_batches = 2
deterministic = true
sqlite_cache_kib = 65536

[preprocessing]
# fit_pad preserves the whole ROI. This contract travels with the saved model.
resize_mode = "fit_pad"
normalization = "dtype"
rescale = true
invert = "auto"
pad_value = 0.0
interpolation = "bilinear"
channel_mode = "grayscale"

[encoder]
# V2 separates encoder family from its concrete topology.
family = "efficientnet"
variant = "efficientnet_b3"

[stem]
# Explicit native stem. Smaller stride/pool preserves fine detail at higher cost.
type = "native"
kernel_size = 3
stride = 2
pool = "none"

[normalization]
type = "batch"

[pooling]
type = "avg"

[image_embedding.projection]
# The fixed-size image representation consumed by fusion and the classifier.
type = "linear"
output_dim = 256
l2_normalize = false

[metadata]
fields = []
scaling = "standard"

[metadata.encoder]
type = "direct"

[metadata.augmentation]
# Gaussian metadata noise is training-only; leave zero unless regularization is intended.
gaussian_variance = 0.0
probability = 1.0
apply_to = "continuous"
fields = []

[fusion]
type = "concat"

[classifier]
type = "linear"

[training]
epochs = 50
optimizer = "adam"
learning_rate = 0.001
loss = "weighted_sparse_categorical_crossentropy"
metrics = ["accuracy", "macro_f1"]

[training.class_weights]
# Effective-number weighting is less volatile than inverse-frequency weighting.
mode = "effective_number"
beta = 0.999
normalize = true

[callbacks]
early_stopping = true
early_stopping_patience = 18
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[augmentation]
# Online augmentation remains stochastic even when deterministic prepared-input caching is enabled.
enabled = true
repeats_per_epoch = 1
invert = false
rotation = 0.5
zoom = 0.2
translation = [0.15, 0.15]
skew = 0.2
flip_horizontal = true
flip_vertical = true
brightness = 0.2
contrast = 0.2
gaussian_noise = 0.05
fill_value = 0.0

[distribution]
# single uses one selected GPU; select mirrored only for intentional multi-GPU training.
strategy = "single"
devices = []
cross_device_ops = "auto"
fallback_to_single = true
memory_growth = true
gpu_selection = "unused_first"
require_unused_gpu = false
allow_busy_fallback = false
gpu_light_share_memory_mb = 1024
gpu_light_share_utilization_percent = 15

[evidence]
# Retain embeddings, prototypes, and nearest-neighbor evidence with predictions.
enabled = true
knn_k = 5

[output]
save_predictions = true
save_figures = true
export_savedmodel = true
