# EfficientNetV2 family alias; resolves to the B0 baseline.
# Use a concrete sibling preset when recording a non-default variant.

[run]
task = "classification"
model = "efficientnet_v2"
seed = 123
notes = "efficientnet_v2 V2 family default"
[architecture]
version = 2
[input]
channels = ["intensity"]
[input.geometry]
type = "preserve_aspect_pad"
[encoder]
family = "efficientnet_v2"
variant = "efficientnet_v2_b0"
[stem]
type = "native"
[data]
input_shape = [128, 128]
batch_size = 16
validation_split = 0.20
test_split = 0.10
[preprocessing]
resize_mode = "fit_pad"
normalization = "dtype"
rescale = true
invert = "auto"
pad_value = 0.0
interpolation = "bilinear"
channel_mode = "grayscale"
[model]
variant = "efficientnet_v2_b0"
embedding_dim = 256
[normalization]
type = "batch"
[pooling]
type = "avg"
[image_embedding.projection]
type = "linear"
output_dim = 256
[metadata]
fields = []
scaling = "standard"
[metadata.encoder]
type = "direct"
[metadata.augmentation]
gaussian_variance = 0.0
probability = 1.0
apply_to = "continuous"
fields = []
[fusion]
type = "concat"
[classifier]
type = "linear"
[training]
epochs = 50
optimizer = "adam"
learning_rate = 0.001
loss = "weighted_sparse_categorical_crossentropy"
metrics = ["accuracy", "macro_f1"]

[training.class_weights]
# Stable default for imbalanced scientific classes; use explicit values only
# when a reviewed class-weight protocol requires them.
mode = "effective_number"
beta = 0.999
normalize = true

[augmentation]
# Conservative geometry-safe policy shared by the documented V2 classifiers.
enabled = true
repeats_per_epoch = 1
invert = false
rotation = 0.5
zoom = 0.20
translation = [0.15, 0.15]
skew = 0.20
flip_horizontal = true
flip_vertical = true
brightness = 0.20
contrast = 0.20
gaussian_noise = 0.05
fill_value = 0.0

[recovery]
# One rolling full-state snapshot makes interrupted experiments resumable.
enabled = true
save_every_epochs = 1

[output]
save_checkpoints = false
save_predictions = true
save_figures = true
export_savedmodel = true
