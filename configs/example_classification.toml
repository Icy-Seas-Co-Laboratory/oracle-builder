# Fast classification baseline. Start here to verify a new dataset and pipeline;
# use ResNet, DenseNet, or EfficientNet when model capacity is the main question.

[run]
task = "classification"
model = "simple_cnn"
seed = 123
notes = "Example classification run"

# New runs use the composable graph by default. Keep this explicit in copied
# experiment recipes so the architecture contract is visible at review time.
[architecture]
version = 2

[input]
channels = ["intensity"]

[input.geometry]
type = "preserve_aspect_pad"

[data]
# Classification defaults assume grayscale. Class count and split assignments
# are inferred from the SQLite dataset and recorded in the run artifact.
input_shape = [128, 128]
batch_size = 16
shuffle_buffer = 512
validation_split = 0.20
test_split = 0.10

[preprocessing]
# fit_pad preserves the full image. Preprocessing travels with the saved model.
resize_mode = "fit_pad"
normalization = "dtype"
rescale = true
invert = "auto"
pad_value = 0.0
interpolation = "bilinear"
channel_mode = "grayscale"

[model]
# base_filters controls overall capacity; embedding_dim fixes feature size.
base_filters = 32
dropout = 0.20
embedding_dim = 256
normalize_embeddings = true

[evidence]
# Preserve embeddings, prototypes, and KNN evidence with predictions.
enabled = true
knn_k = 5

[training]
epochs = 10
optimizer = "adam"
learning_rate = 0.001
# Weighted cross entropy is the default; ordinary sparse cross entropy is the
# simpler alternative when the dataset is already balanced.
loss = "weighted_sparse_categorical_crossentropy"
metrics = ["accuracy", "macro_f1"]

[training.class_weights]
# effective_number is gentler than inverse_frequency; explicit accepts a list.
mode = "effective_number"
beta = 0.999
normalize = true

[callbacks]
early_stopping = true
early_stopping_patience = 5
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[recovery]
# One rolling full-state snapshot enables restart without keeping every epoch.
enabled = false
save_every_epochs = 1

[augmentation]
# Shared classification policy. rotation=0.5 permits any orientation.
enabled = true
repeats_per_epoch = 1
invert = false # Assume black background and light foreground.
rotation = 0.5
zoom = 0.20
translation = [0.15, 0.15]
skew = 0.20
flip_horizontal = true
flip_vertical = true
brightness = 0.20
contrast = 0.20
gaussian_noise = 0.05
fill_value = 0.0

[output]
# The final model is saved; per-epoch checkpoints are opt-in.
save_checkpoints = false
save_predictions = true
save_figures = true
export_savedmodel = false

[encoder]
family = "simple_cnn"
variant = "simple_cnn"
[stem]
type = "native"
kernel_size = 3
stride = 1
pool = "none"
[normalization]
type = "batch"
[pooling]
type = "avg"
[image_embedding.projection]
type = "linear"
output_dim = 256
l2_normalize = false
[metadata]
fields = []
scaling = "standard"
[metadata.encoder]
type = "direct"
[metadata.augmentation]
gaussian_variance = 0.0
probability = 1.0
apply_to = "continuous"
fields = []
[fusion]
type = "concat"
[classifier]
type = "linear"

# Bounded SQLite data pipeline: decode active examples lazily and retain only
# a small prefetch queue in memory.
[data.streaming]
enabled = true
reader_workers = 4
prefetch_batches = 2
deterministic = true
sqlite_cache_kib = 65536

# Use one visible GPU when available; an empty list permits CPU fallback.
[distribution]
strategy = "single"
devices = []
cross_device_ops = "auto"
fallback_to_single = true
memory_growth = true
gpu_selection = "unused_first"
require_unused_gpu = false
allow_busy_fallback = false
gpu_light_share_memory_mb = 1024
gpu_light_share_utilization_percent = 15
