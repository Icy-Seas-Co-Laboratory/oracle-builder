[run]
task = "segmentation"
model = "residual_unet"
seed = 123
notes = "Example residual U-Net segmentation run"

[data]
input_shape = [256, 256, 3]
output_shape = [256, 256, 1]
batch_size = 8
shuffle_buffer = 128
validation_split = 0.25
test_split = 0.1
# Input channels: grayscale ROI, binary candidate mask, and image-guided distance.
candidate_distance = "geodesic" # "none", "euclidean_sdf", or "geodesic"
candidate_distance_clip = 32.0

[data.geodesic_distance]
epsilon = 0.001
intensity_weight = 1.0 # Bright continuous structure is cheap to traverse.
intensity_gamma = 1.0
gradient_weight = 1.0 # Strong boundaries are expensive to traverse.
connectivity = 8

[model]
base_filters = 32
depth = 4
dropout = 0.1
activation = "relu"
final_activation = "sigmoid"

[training]
epochs = 40
optimizer = "adam"
learning_rate = 0.0002
loss = "bce_soft_tversky" # BCE plus recall-biased soft Tversky.
bce_weight = 1.0
soft_tversky_weight = 1.0
tversky_alpha = 0.3
tversky_beta = 0.7 # Higher false-negative cost favors expansion.
soft_tversky_smooth = 0.000001
metrics = ["accuracy", "dice", "iou"]
#segmentation_target = "validated_mask"
segmentation_target = "candidate_delta"

[pretraining]
# Optional grayscale-only reconstruction pretraining from either dataset type.
enabled = false
method = "grayscale_reconstruction"
database = "datasets/classification-corpus.sqlite"
epochs = 50
learning_rate = 0.001
# Gives bright image structure more influence than the large dark background.
reconstruction_foreground_weight = 4.0

[callbacks]
early_stopping = true
early_stopping_patience = 8
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[augmentation]
enabled = true
repeats_per_epoch = 2
invert = false # Assume black background and light foreground.
rotation = 0.5
zoom = 0.25
translation = [0.25, 0.25]
skew = 0.20
flip_horizontal = true
flip_vertical = true
brightness = 0.25
contrast = 0.25
gaussian_noise = 0.05
fill_value = 0.0
mask_fill_value = 0.0
photometric_channels = [0]
mask_input_channels = [1]

[output]
save_checkpoints = true
save_predictions = true
save_figures = true
export_savedmodel = true

[tiling]
enabled = false
overlap_fraction = 0.5
blend_mode = "hann"
tile_large_rois_only = true
normalize_training_coverage = true
