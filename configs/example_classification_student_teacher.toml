# Self-supervised student-teacher example. BYOL first learns image structure
# without labels, then the same ResNet is fine-tuned for classification.

[run]
task = "classification"
model = "resnet"
seed = 123
notes = "BYOL pretraining followed by supervised ResNet-18 fine-tuning"

[data]
# Grayscale is assumed. Class count comes from the SQLite dataset.
input_shape = [224, 224, 1]
batch_size = 16
shuffle_buffer = 512
validation_split = 0.20
test_split = 0.10

[preprocessing]
resize_mode = "fit_pad"
normalization = "dtype"
rescale = true
invert = "auto" # Resolve from the dataset's recorded source polarity.
pad_value = 0.0
interpolation = "bilinear"
channel_mode = "grayscale"

[model]
# ResNet variants: 18, 34, 50, 101, and 152. ResNet-18 is a practical
# pretraining baseline; move upward only when data and compute support it.
variant = "resnet18"
stem_kernel_size = 7
stem_stride = 2
stem_pool = true
base_filters = 64
dropout = 0.0
embedding_dim = 256
normalize_embeddings = true

[pretraining]
# BYOL/student_teacher avoids negative pairs and tolerates moderate batches.
# SimCLR is also supported and typically benefits from larger batches.
enabled = true
method = "byol" # byol, student_teacher, or simclr
epochs = 50
learning_rate = 0.001
teacher_momentum = 0.99
temperature = 0.10 # Used by SimCLR only.
projection_dim = 128
projection_hidden_dim = 256
use_training_augmentation = true

[evidence]
# Save embeddings, class prototypes, and KNN evidence with predictions.
enabled = true
knn_k = 5

[training]
epochs = 50
optimizer = "adam"
learning_rate = 0.0003
loss = "weighted_sparse_categorical_crossentropy"
metrics = ["accuracy"]

[training.class_weights]
mode = "effective_number"
beta = 0.999
normalize = true

[callbacks]
early_stopping = true
early_stopping_patience = 8
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[recovery]
# One rolling full-state snapshot enables restart during supervised fine-tuning.
enabled = true
save_every_epochs = 1

[augmentation]
# Shared by pretraining and fine-tuning. rotation=0.5 permits any orientation.
enabled = true
repeats_per_epoch = 1
invert = false # Assume black background and light foreground.
rotation = 0.5
zoom = 0.20
translation = [0.15, 0.15]
skew = 0.20
flip_horizontal = true
flip_vertical = true
brightness = 0.20
contrast = 0.20
gaussian_noise = 0.05
fill_value = 0.0

[output]
# The final model is saved; per-epoch checkpoints are opt-in.
save_checkpoints = false
save_predictions = true
save_figures = true
export_savedmodel = true
