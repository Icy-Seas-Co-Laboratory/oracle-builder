[run]
task = "classification"
model = "resnet"
seed = 123
notes = "BYOL-style student-teacher pretraining followed by supervised ResNet-18 fine-tuning"

[data]
input_shape = [224, 224, 3]
num_classes = 3
batch_size = 16
shuffle_buffer = 512
validation_split = 0.2
test_split = 0.1

[preprocessing]
resize_mode = "fit_pad"
normalization = "dtype"
rescale = true
invert = false
pad_value = 0.0
interpolation = "bilinear"
channel_mode = "auto"

[model]
variant = "resnet18"
stem_kernel_size = 7
stem_stride = 2
base_filters = 64
dropout = 0.0
embedding_dim = 256
normalize_embeddings = true

[evidence]
enabled = true
knn_k = 5

[pretraining]
enabled = true
method = "byol"
epochs = 50
learning_rate = 0.001
teacher_momentum = 0.99
projection_dim = 128
projection_hidden_dim = 256

[pretraining.augmentation]
rotation = 0.08
zoom = 0.15
translation = 0.10
skew = 0.05
flip_horizontal = true
flip_vertical = false
brightness = 0.20
contrast = 0.20
gaussian_noise = 0.03
fill_value = 0.0

[training]
epochs = 50
optimizer = "adam"
learning_rate = 0.0003
loss = "sparse_categorical_crossentropy"
metrics = ["accuracy"]

[callbacks]
early_stopping = true
early_stopping_patience = 8
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[augmentation]
enabled = true
rotation = 0.05
zoom = 0.10
translation = 0.05
flip_horizontal = true
brightness = 0.10
contrast = 0.10

[output]
save_checkpoints = true
save_predictions = true
save_figures = true
export_savedmodel = true
