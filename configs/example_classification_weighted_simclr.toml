# SimCLR plus weighted classification example. Use this when unlabeled
# structure and class imbalance are both important.

[run]
task = "classification"
model = "simple_cnn"
seed = 123
notes = "SimpleCNN with SimCLR self-supervised training and weighted cross entropy"

[data]
# Grayscale is assumed. Class count and splits are derived at run time.
input_shape = [224, 224]
batch_size = 8
shuffle_buffer = 4096
validation_split = 0.20
test_split = 0.10

[data.streaming]
enabled = true
reader_workers = 4
prefetch_batches = 2
deterministic = true
sqlite_cache_kib = 65536

[preprocessing]
resize_mode = "fit_pad"
normalization = "dtype"
rescale = true
invert = "auto" # Resolve from the dataset's recorded source polarity.
pad_value = 0.0
interpolation = "bilinear"
channel_mode = "grayscale"

[model]
# SimpleCNN is the fastest baseline. ResNet, DenseNet, and EfficientNet are
# stronger family choices when additional capacity is justified.
base_filters = 32
embedding_dim = 256
normalize_embeddings = true
dropout = 0.20

[self_supervised]
# SimCLR uses contrastive negatives and benefits from larger effective batches.
# BYOL is the less batch-size-sensitive alternative.
enabled = true
method = "simclr" # simclr, byol, or student_teacher
epochs = 30
learning_rate = 0.001
temperature = 0.10
projection_dim = 128
projection_hidden_dim = 256

[training]
epochs = 50
optimizer = "adam"
learning_rate = 0.0003
loss = "weighted_sparse_categorical_crossentropy"
metrics = ["accuracy", "macro_f1"]

[training.class_weights]
# effective_number moderates rare-class weighting; inverse_frequency is stronger.
mode = "effective_number"
beta = 0.999
normalize = true

[evidence]
enabled = true
knn_k = 5

[callbacks]
early_stopping = true
early_stopping_patience = 8
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[recovery]
# One rolling full-state snapshot enables restart during supervised fine-tuning.
enabled = true
save_every_epochs = 1

[augmentation]
# Self-supervised view augmentation is independent of supervised augmentation. rotation=0.5 permits any orientation.
enabled = true
repeats_per_epoch = 1
invert = false # Assume black background and light foreground.
rotation = 0.5
zoom = 0.20
translation = [0.15, 0.15]
skew = 0.20
flip_horizontal = true
flip_vertical = true
brightness = 0.20
contrast = 0.20
gaussian_noise = 0.05
fill_value = 0.0

[inference]
# Auto batching adapts throughput to input size and available memory.
batch_size = "auto"
minimum_batch_size = 1
maximum_batch_size = 64
memory_budget_mb = 512
progress = true

[evaluation.benchmark]
enabled = true
warmup_batches = 2
measured_batches = 10

[output]
# The final model is saved; per-epoch checkpoints are opt-in.
save_checkpoints = false
save_predictions = true
save_figures = true
export_savedmodel = true
prediction_commit_batches = 20
# Explicit V2 component contract. The encoder remains native; its output is
# pooled, projected, optionally fused with declared metadata, then classified.
[architecture]
version = 2
[input]
channels = ["intensity"]
[input.geometry]
type = "preserve_aspect_pad"
[encoder]
family = "simple_cnn"
variant = "simple_cnn"
[stem]
type = "native"
kernel_size = 3
stride = 1
pool = "none"
[normalization]
type = "batch"
[pooling]
type = "avg"
[image_embedding.projection]
type = "linear"
output_dim = 256
l2_normalize = false
[metadata]
fields = []
scaling = "standard"
[metadata.encoder]
type = "direct"
[metadata.augmentation]
gaussian_variance = 0.0
probability = 1.0
apply_to = "continuous"
fields = []
[fusion]
type = "concat"
[classifier]
type = "linear"

# Use one visible GPU when available; an empty list permits CPU fallback.
[distribution]
strategy = "single"
devices = []
cross_device_ops = "auto"
fallback_to_single = true
memory_growth = true
gpu_selection = "unused_first"
require_unused_gpu = false
allow_busy_fallback = false
gpu_light_share_memory_mb = 1024
gpu_light_share_utilization_percent = 15
