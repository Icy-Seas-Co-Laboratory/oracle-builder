[run]
task = "segmentation"
model = "unet_plus_plus"
seed = 123
notes = "Example U-Net++ segmentation run"

[data]
input_shape = [128, 128, 3]
output_shape = [128, 128, 1]
batch_size = 4
shuffle_buffer = 128
validation_split = 0.25
test_split = 0.1
# Input channels: grayscale ROI, binary candidate mask, and image-guided distance.
candidate_distance = "geodesic" # "none", "euclidean_sdf", or "geodesic"
candidate_distance_clip = 32.0

[data.geodesic_distance]
epsilon = 0.001
intensity_weight = 1.0
intensity_gamma = 1.0
gradient_weight = 1.0 # Penalize travel across intensity boundaries.
connectivity = 8

[model]
base_filters = 32
depth = 4
dropout = 0.1
activation = "relu"
final_activation = "sigmoid"
deep_supervision = false

[self_supervised]
# Optional grayscale-only reconstruction self-supervised training from either dataset type.
enabled = true
method = "grayscale_reconstruction"
database = "./datasets/ROI-Refinement/dataset.checkpoint-20260811T191330.260682Z.sqlite"
epochs = 10
learning_rate = 0.001
# Gives bright image structure more influence than the large dark background.
reconstruction_foreground_weight = 4.0

[training]
epochs = 10
optimizer = "adam"
learning_rate = 0.0001
loss = "bce_soft_tversky" # BCE plus recall-biased soft Tversky.
bce_weight = 1.0
soft_tversky_weight = 1.0
tversky_alpha = 0.3
tversky_beta = 0.7 # Higher false-negative cost favors expansion.
soft_tversky_smooth = 0.000001
metrics = ["accuracy", "dice", "iou"]
#segmentation_target = "validated_mask"
segmentation_target = "candidate_delta"


[callbacks]
early_stopping = true
early_stopping_patience = 8
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[augmentation]
enabled = true
repeats_per_epoch = 1
invert = false # Assume black background and light foreground.
rotation = 0.5
zoom = 0.20
translation = [0.25, 0.25]
skew = 0.20
flip_horizontal = true
flip_vertical = true
brightness = 0.25
contrast = 0.25
gaussian_noise = 0.05
fill_value = 0.0
mask_fill_value = 0.0
photometric_channels = [0]
mask_input_channels = [1]

[output]
save_checkpoints = false
save_predictions = true
save_figures = true
export_savedmodel = true

[tiling]
enabled = true
overlap_fraction = 0.5
blend_mode = "hann"
tile_large_rois_only = true
normalize_training_coverage = true
