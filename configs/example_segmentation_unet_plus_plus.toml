[run]
task = "segmentation"
model = "unet_plus_plus"
seed = 123
notes = "Example U-Net++ segmentation run"

[data]
input_shape = [128, 128, 3]
output_shape = [128, 128, 1]
batch_size = 8
shuffle_buffer = 128
validation_split = 0.25
test_split = 0.1
candidate_sdf = true
candidate_sdf_clip_distance = 32.0

[model]
base_filters = 32
depth = 4
dropout = 0.1
activation = "relu"
final_activation = "sigmoid"
deep_supervision = false

[training]
epochs = 40
optimizer = "adam"
learning_rate = 0.0001
loss = "bce_soft_dice"
bce_weight = 1.0
soft_dice_weight = 1.0
metrics = ["accuracy", "dice", "iou"]
#segmentation_target = "validated_mask"
segmentation_target = "candidate_delta"

[callbacks]
early_stopping = true
early_stopping_patience = 8
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[augmentation]
enabled = true
repeats_per_epoch = 2
invert = false # Assume black background and light foreground.
rotation = 0.5
zoom = 0.25
translation = [0.25, 0.25]
skew = 0.20
flip_horizontal = true
flip_vertical = true
brightness = 0.25
contrast = 0.25
gaussian_noise = 0.05
fill_value = 0.0
mask_fill_value = 0.0
photometric_channels = [0]
mask_input_channels = [1]

[output]
save_checkpoints = false
save_predictions = true
save_figures = true
export_savedmodel = true

[tiling]
enabled = true
overlap_fraction = 0.5
blend_mode = "hann"
tile_large_rois_only = true
normalize_training_coverage = true
