# ResNet classification example. ResNet is a dependable general-purpose family
# and a useful default when the lightweight CNN underfits.

[run]
task = "classification"
model = "resnet"
seed = 123
notes = "ROI-friendly ResNet-18 classification example"

[data]
# Grayscale is assumed. Class count comes from the SQLite dataset.
input_shape = [128, 128, 1]
batch_size = 16
shuffle_buffer = 512
validation_split = 0.20
test_split = 0.10

[preprocessing]
resize_mode = "fit_pad"
normalization = "dtype"
rescale = true
invert = "auto" # Resolve from the dataset's recorded source polarity.
pad_value = 0.0
interpolation = "bilinear"
channel_mode = "grayscale"

[model]
# Variants: resnet18, resnet34, resnet50, resnet101, resnet152.
# Start with 18 for from-scratch ROI training; scale up only after it learns.
variant = "resnet18"
stem_kernel_size = 3
stem_stride = 1
stem_pool = false
base_filters = 64
dropout = 0.0
embedding_dim = 256
normalize_embeddings = false

[evidence]
enabled = true
knn_k = 5

[training]
epochs = 50
optimizer = "adam"
learning_rate = 0.001
loss = "weighted_sparse_categorical_crossentropy"
metrics = ["accuracy"]

[training.class_weights]
# effective_number is a moderate default; inverse_frequency is more aggressive.
mode = "effective_number"
beta = 0.999
normalize = true

[callbacks]
early_stopping = true
early_stopping_patience = 8
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[recovery]
# One rolling full-state snapshot enables restart without keeping every epoch.
enabled = true
save_every_epochs = 1

[augmentation]
# Shared classification policy. rotation=0.5 permits any orientation.
enabled = true
repeats_per_epoch = 1
invert = false # Assume black background and light foreground.
rotation = 0.5
zoom = 0.20
translation = [0.15, 0.15]
skew = 0.20
flip_horizontal = true
flip_vertical = true
brightness = 0.20
contrast = 0.20
gaussian_noise = 0.05
fill_value = 0.0

[output]
# The final model is saved; per-epoch checkpoints are opt-in.
save_checkpoints = false
save_predictions = true
save_figures = true
export_savedmodel = true
