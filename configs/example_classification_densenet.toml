[run]
task = "classification"
model = "densenet"
seed = 123
notes = "DenseNet-121 classification example"

[data]
input_shape = [224, 224, 3]
num_classes = 3
batch_size = 16
shuffle_buffer = 512
validation_split = 0.2
test_split = 0.1

[preprocessing]
resize_mode = "fit_pad"
normalization = "dtype"
rescale = true
invert = false
pad_value = 0.0
interpolation = "bilinear"
channel_mode = "auto"

[model]
variant = "densenet121"
stem_kernel_size = 7
stem_stride = 2
stem_pool = true
growth_rate = 32
compression = 0.5
dropout = 0.0
embedding_dim = 256
normalize_embeddings = true

[evidence]
enabled = true
knn_k = 5

[training]
epochs = 50
optimizer = "adam"
learning_rate = 0.001
loss = "sparse_categorical_crossentropy"
metrics = ["accuracy"]

[callbacks]
early_stopping = true
early_stopping_patience = 8
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[augmentation]
enabled = true
flip_horizontal = true
rotation = 0.1

[output]
save_checkpoints = true
save_predictions = true
save_figures = true
export_savedmodel = true
