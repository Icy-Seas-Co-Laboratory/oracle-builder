[run]
task = "segmentation"
model = "unet"
seed = 123
notes = "Example U-Net segmentation run"

[data]
input_shape = [256, 256, 2]
output_shape = [256, 256, 1]
batch_size = 8
shuffle_buffer = 128
validation_split = 0.25
test_split = 0.1

[model]
base_filters = 32
depth = 4
dropout = 0.1
activation = "relu"
final_activation = "sigmoid"

[training]
epochs = 20
optimizer = "adam"
learning_rate = 0.0001
loss = "binary_crossentropy"
metrics = ["accuracy", "dice", "iou"]

[callbacks]
early_stopping = true
early_stopping_patience = 8
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[augmentation]
enabled = false
invert = false
rotation = 0.05
zoom = 0.15
translation = [0.10, 0.10]
skew = 0.05
flip_horizontal = true
flip_vertical = true
brightness = 0.15
contrast = 0.15
gaussian_noise = 0.03
fill_value = 0.0
mask_fill_value = 0.0
photometric_channels = [0]
mask_input_channels = [1]

[output]
save_checkpoints = true
save_predictions = true
save_figures = true
export_savedmodel = true
