# Candidate-mask refinement baseline using a U-Net spatial decoder.
#
# This maintained template is strict Architecture V2 authoring data.  The
# encoder declaration is translated to the U-Net runtime builder only while
# resolving the sealed queued TOML.

[run]
task = "segmentation"
seed = 123
notes = "U-Net candidate-mask refinement baseline"

[architecture]
version = 2

[input]
channels = ["intensity", "foreground_mask", "foreground_distance"]

[input.geometry]
type = "preserve_aspect_pad"

[data]
# Intensity, candidate mask, and candidate distance are the three decoder
# inputs.  The frozen mask-refinement dataset supplies their source records.
input_shape = [256, 256, 3]
output_shape = [256, 256, 1]
batch_size = 8
shuffle_buffer = 128
validation_split = 0.25
test_split = 0.1
candidate_distance = "geodesic"
candidate_distance_clip = 32.0

[data.geodesic_distance]
epsilon = 0.001
intensity_weight = 1.0
intensity_gamma = 1.0
gradient_weight = 1.0
connectivity = 8

[encoder]
family = "unet"
variant = "unet"

[training]
epochs = 40
optimizer = "adam"
learning_rate = 0.0001
loss = "bce_soft_tversky"
metrics = ["accuracy", "dice", "iou"]
segmentation_target = "candidate_delta"
spatial_edge_weighting = true
edge_weight_lambda = 1.0
edge_weight_sigma = 6.0
bce_weight = 1.0
soft_tversky_weight = 1.0
tversky_alpha = 0.3
tversky_beta = 0.7

[augmentation]
enabled = true
repeats_per_epoch = 2
rotation = 0.5
zoom = 0.25
translation = [0.25, 0.25]
skew = 0.20
flip_horizontal = true
flip_vertical = true
brightness = 0.25
contrast = 0.25
gaussian_noise = 0.05
fill_value = 0.0
mask_fill_value = 0.0
photometric_channels = [0]
mask_input_channels = [1]
signed_distance_input_channels = [2]

[distribution]
strategy = "single"
devices = []
memory_growth = true
fallback_to_single = true

[tiling]
enabled = true
overlap_fraction = 0.5
blend_mode = "hann"
tile_large_rois_only = true
normalize_training_coverage = true

[output]
save_predictions = true
save_figures = true
export_savedmodel = true
