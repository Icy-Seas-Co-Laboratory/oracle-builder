# EfficientNet classification example. This family scales depth, width, and
# resolution together and is useful when accuracy per unit compute matters.

[run]
task = "classification"
model = "efficientnet"
seed = 123
notes = "EfficientNet-B0 classification example"

[data]
# Grayscale is assumed. Class count comes from the SQLite dataset.
input_shape = [224, 224, 1]
batch_size = 16
shuffle_buffer = 512
validation_split = 0.20
test_split = 0.10

[preprocessing]
resize_mode = "fit_pad"
normalization = "dtype"
rescale = true
invert = false
pad_value = 0.0
interpolation = "bilinear"
channel_mode = "grayscale"

[model]
# Variants: efficientnet_b0 through efficientnet_b7.
# B0 is the economical default; larger variants need more memory and resolution.
variant = "efficientnet_b0"
stem_kernel_size = 3
stem_stride = 2
dropout = 0.20
se_ratio = 0.25
embedding_dim = 256
normalize_embeddings = true

[evidence]
enabled = true
knn_k = 5

[training]
epochs = 50
optimizer = "adam"
learning_rate = 0.001
loss = "weighted_sparse_categorical_crossentropy"
metrics = ["accuracy"]

[training.class_weights]
mode = "effective_number"
beta = 0.999
normalize = true

[callbacks]
early_stopping = true
early_stopping_patience = 8
reduce_lr_on_plateau = true
checkpoint_monitor = "val_loss"

[augmentation]
# Shared classification policy. rotation=0.5 permits any orientation.
enabled = true
repeats_per_epoch = 1
invert = false # Assume black background and light foreground.
rotation = 0.5
zoom = 0.20
translation = [0.15, 0.15]
skew = 0.20
flip_horizontal = true
flip_vertical = true
brightness = 0.20
contrast = 0.20
gaussian_noise = 0.05
fill_value = 0.0

[output]
# The final model is saved; per-epoch checkpoints are opt-in.
save_checkpoints = false
save_predictions = true
save_figures = true
export_savedmodel = true
