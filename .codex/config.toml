# Project-scoped Codex configuration for Oracle Builder and its sibling repositories.
# Keep the final integration in the primary thread; use bounded subagents for
# independent discovery, implementation, and high-consequence review.

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

